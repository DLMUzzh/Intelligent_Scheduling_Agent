<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172e2b" />
    <title>Fleetwise · 司机智能排班</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23172e2b'/%3E%3Cpath d='M14 34V14h22v6H20v4h13v6H20v4' fill='%23b8e58c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳至内容</a>
    <aside class="sidebar">
      <a class="brand" href="#overview"
        ><span class="brand-symbol">F<span>↗</span></span
        ><span>Fleetwise<small>采集车队 · 智能排班</small></span></a
      >
      <div class="workspace">
        <span class="workspace-avatar">采</span>
        <div>道路数据采集中心<small>车队管理工作空间</small></div>
        <span class="online-dot"></span>
      </div>
      <div class="nav-label">工作空间</div>
      <nav aria-label="主导航">
        <a href="#overview" data-page="overview"
          ><span data-icon="grid"></span>工作台</a
        >
        <a href="#plans" data-page="plans"
          ><span data-icon="layers"></span>采集计划</a
        >
        <a href="#scheduling" data-page="scheduling"
          ><span data-icon="calendar"></span>排班工作台<span class="nav-pill"
            >核心</span
          ></a
        >
        <a href="#fleet" data-page="fleet"
          ><span data-icon="truck"></span>车队资源</a
        >
        <a href="#statistics" data-page="statistics"
          ><span data-icon="chart"></span>排班统计</a
        >
        <a href="#notifications" data-page="notifications"
          ><span data-icon="bell"></span>通知中心</a
        >
      </nav>
      <div class="nav-label secondary-label">更多工具</div>
      <nav aria-label="更多工具">
        <a href="#agent" data-page="agent"
          ><span data-icon="spark"></span>Agent 助手<span class="soon"
            >预留</span
          ></a
        >
        <a href="#audit" data-page="audit"
          ><span data-icon="shield"></span>操作日志</a
        >
      </nav>
      <div class="sidebar-tip">
        <span class="tip-mark">↗</span><strong>每一次采集，都有好安排</strong>
        <p>效率优先，负载均衡。<br />排班确认后才正式生效。</p>
      </div>
      <div class="profile">
        <span class="avatar">管</span>
        <div>车队长<small>本地管理工作空间</small></div>
        <span class="version">V3.0</span>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb">
          工作空间<span>/</span><strong id="breadcrumb">工作台</strong>
        </div>
        <div class="topbar-actions">
          <span class="connection"
            ><i class="online-dot"></i
            ><span id="connection-state">正在连接</span></span
          ><a href="/docs" target="_blank" rel="noreferrer" class="text-button"
            >API 文档 ↗</a
          ><button
            class="icon-button"
            id="access-key"
            aria-label="配置 API 访问密钥"
            title="配置 API 访问密钥"
          >
            <span data-icon="key"></span>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1" aria-busy="false"></main>
      <footer class="page-footer">
        <span>Fleetwise · Driver Scheduling Agent</span
        ><span>以确定性规则，安排每一程。</span>
      </footer>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <div id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
