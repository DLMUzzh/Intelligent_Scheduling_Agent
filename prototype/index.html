<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b35">
  <title>Fleetwise · 司机智能排班</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23173b35'/%3E%3Cpath d='M9 23V9h14M9 16h11' stroke='%23d4f199' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 5h2m4 0h2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-16a3 3 0 0 1 0 6m2 10v-3a6 6 0 0 0-2-4"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v12H3zm11 5h4l3 4v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7m2-5v6l4 2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M9 16v-5m5 5V7m5 9V4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1m-1 7h1m-1 7h1"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3zM20 3v4m-2-2h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14v6z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4 2 19a1 1 0 0 0 1 2h18a1 1 0 0 0 1-2L13.7 4a2 2 0 0 0-3.4 0zM12 9v4m0 4h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8A8 8 0 0 0 6 5L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 3 19 9-19 9 4-9-4-9zm4 9h15"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10m-12 12h6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H4v16h6m4-13 5 5-5 5M8 12h12"/></symbol>
  </svg>
  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="#workbench" aria-label="Fleetwise 排班工作台"><span class="brand-mark">F<span></span></span><span>Fleetwise<small>司机智能排班</small></span></a>
    <div class="workspace-label"><span class="status-dot"></span><span>华东采集车队</span><span class="micro-pill">单车队</span></div>
    <div class="nav-label">工作空间</div>
    <nav>
      <button class="nav-item active" data-view="workbench"><svg><use href="#i-grid"/></svg><span>排班工作台</span><span class="nav-count" id="draft-count">—</span></button>
      <button class="nav-item" data-view="plans"><svg><use href="#i-calendar"/></svg><span>采集计划</span></button>
      <button class="nav-item" data-view="resources"><svg><use href="#i-users"/></svg><span>车队资源</span></button>
      <div class="nav-divider"></div><div class="nav-label">分析与记录</div>
      <button class="nav-item" data-view="history"><svg><use href="#i-history"/></svg><span>排班历史</span></button>
      <button class="nav-item" data-view="reports"><svg><use href="#i-chart"/></svg><span>统计分析</span></button>
      <button class="nav-item" data-view="logs"><svg><use href="#i-list"/></svg><span>操作记录</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="agent-launch" data-action="agent-toggle"><span class="agent-orbit"><svg><use href="#i-spark"/></svg></span><span><strong>让 Agent 帮你安排</strong><small>查询、预览与受控操作</small></span><svg class="icon"><use href="#i-arrow"/></svg></button>
      <button class="profile" data-action="settings"><span class="avatar">周</span><span><strong>周队长</strong><small>车队长 · 唯一操作角色</small></span><svg class="icon"><use href="#i-down"/></svg></button>
    </div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <div class="breadcrumb"><span>工作空间</span><svg class="icon"><use href="#i-chevron"/></svg><strong id="breadcrumb-title">排班工作台</strong></div>
      <div class="top-actions"><span class="prototype-tag">交互原型</span><button class="date-control" data-action="settings"><span class="status-dot"></span><span>演示日期 <b id="demo-date"></b></span><svg class="icon"><use href="#i-down"/></svg></button><span class="top-separator"></span><button class="icon-button" data-action="notification" aria-label="通知未接入" title="通知未接入"><svg class="icon"><use href="#i-bell"/></svg><span class="notification-dot"></span></button><span class="avatar small">周</span></div>
    </header>
    <div id="stale-banner" class="stale-banner" hidden>其他页面已更新演示数据，请载入最新内容后继续。<button data-action="reload-data">载入最新数据</button></div>
    <main id="view" tabindex="-1"></main>
    <footer class="app-footer"><span><span class="status-dot"></span>演示数据 · 仅保存在当前浏览器</span><span>Fleetwise / 让资源各就其位</span></footer>
  </div>
  <aside id="agent-panel" class="agent-panel" aria-label="排班 Agent 助理" hidden>
    <div class="agent-header"><span class="agent-orbit"><svg><use href="#i-spark"/></svg></span><div><strong>Fleetwise Agent</strong><small>你的排班协作助手</small></div><span class="pill neutral">交互演示</span><button class="icon-button" data-action="agent-toggle" aria-label="关闭 Agent"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div class="agent-context" id="agent-context"></div>
    <div id="agent-messages" class="agent-messages" aria-live="polite"></div>
    <form id="agent-form" class="agent-composer"><textarea id="agent-input" rows="2" aria-label="向 Agent 提问" placeholder="例如：查询明天的采集需求"></textarea><div><span>写入前，由你最终确认</span><button type="submit" class="send-button" aria-label="发送消息"><svg class="icon"><use href="#i-send"/></svg></button></div></form>
    <p class="agent-disclaimer">本地预设交互，未连接大模型或服务端。</p>
  </aside>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="login-overlay" class="login-overlay" hidden></div>
</body>
</html>
